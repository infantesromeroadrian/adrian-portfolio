<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc"><title id="title">Where the permission decision belongs</title><desc id="desc">Proposed defensive design — not a mitigation tested in the challenge.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#385363"/></marker></defs><rect width="1600" height="860" fill="#f4f1e8"/><text x="64" y="78" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#182223"><tspan x="64" dy="0">Where the permission decision belongs</tspan></text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#385363"><tspan x="64" dy="0">Proposed defensive design — not a mitigation tested in the challenge.</tspan></text><rect x="64" y="255" width="302" height="178" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="86" y="298" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#182223"><tspan x="86" dy="0">Model proposal</tspan></text><text x="86" y="343" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="86" dy="0">An intent is not a</tspan><tspan x="86" dy="28.6">permission</tspan></text><rect x="454" y="255" width="302" height="178" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="476" y="298" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#182223"><tspan x="476" dy="0">Application policy</tspan></text><text x="476" y="343" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="476" dy="0">Validate the</tspan><tspan x="476" dy="28.6">effective resource</tspan></text><rect x="844" y="255" width="302" height="178" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="866" y="298" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#182223"><tspan x="866" dy="0">Retrieval tool</tspan></text><text x="866" y="343" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="866" dy="0">Use only the</tspan><tspan x="866" dy="28.6">permitted scope</tspan></text><rect x="1234" y="255" width="302" height="178" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="1256" y="298" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="700" fill="#182223"><tspan x="1256" dy="0">Bounded result</tspan></text><text x="1256" y="343" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="1256" dy="0">Label output before</tspan><tspan x="1256" dy="28.6">reuse</tspan></text><path d="M366,344 L442,344" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><path d="M756,344 L832,344" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><path d="M1146,344 L1222,344" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><text x="770" y="319" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#325549"><tspan x="770" dy="0">Allow</tspan></text><path d="M605,433 L605,524" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><rect x="454" y="540" width="302" height="108" rx="10" fill="#f2e1dd" stroke="#7b403b" stroke-width="2"/><text x="478" y="580" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#7b403b"><tspan x="478" dy="0">Deny: stop here</tspan></text><text x="478" y="618" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#7b403b"><tspan x="478" dy="0">No retrieval occurs</tspan></text><rect x="64" y="698" width="1472" height="77" rx="10" fill="#f4f1e8" stroke="#9b9e93" stroke-width="2"/><text x="88" y="744" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="400" fill="#182223"><tspan x="88" dy="0">Apply the policy to the effective destination, including redirects, before access occurs.</tspan></text><text x="64" y="825" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#385363"><tspan x="64" dy="0">Adrian Infantes  /  AI Security Write-ups</tspan></text></svg>