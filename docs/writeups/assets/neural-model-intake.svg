<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" role="img" aria-labelledby="title desc"><title id="title">Deciding whether to load a model</title><desc id="desc">Proposed intake workflow — isolation comes before any justified model loading.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#385363"/></marker></defs><rect width="1600" height="860" fill="#f4f1e8"/><text x="64" y="78" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#182223"><tspan x="64" dy="0">Deciding whether to load a model</tspan></text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#385363"><tspan x="64" dy="0">Proposed intake workflow — isolation comes before any justified model loading.</tspan></text><rect x="64" y="226" width="302" height="161" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="86" y="271" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="86" dy="0">1. Provenance</tspan></text><text x="86" y="315" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="86" dy="0">Record origin and</tspan><tspan x="86" dy="28.6">artifact identity</tspan></text><rect x="454" y="226" width="302" height="161" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="476" y="271" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="476" dy="0">2. Inspection</tspan></text><text x="476" y="315" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="476" dy="0">Treat the container as</tspan><tspan x="476" dy="28.6">untrusted data</tspan></text><rect x="64" y="510" width="302" height="161" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="86" y="555" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="86" dy="0">5. Observations</tspan></text><text x="86" y="599" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="86" dy="0">Record findings and</tspan><tspan x="86" dy="28.6">remaining limits</tspan></text><rect x="454" y="510" width="302" height="161" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="476" y="555" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="700" fill="#182223"><tspan x="476" dy="0">4. Restricted loading</tspan></text><text x="476" y="599" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="476" dy="0">Retain loading</tspan><tspan x="476" dy="28.6">restrictions</tspan></text><rect x="844" y="510" width="302" height="161" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="866" y="555" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="866" dy="0">3. Isolation</tspan></text><text x="866" y="599" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#385363"><tspan x="866" dy="0">Prepare a disposable</tspan><tspan x="866" dy="28.6">environment</tspan></text><rect x="844" y="226" width="692" height="161" rx="10" fill="#e4ebe5" stroke="#325549" stroke-width="2"/><text x="870" y="271" font-family="DejaVu Sans, sans-serif" font-size="26" font-weight="700" fill="#325549"><tspan x="870" dy="0">Is loading necessary and approved?</tspan></text><text x="870" y="319" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#325549"><tspan x="870" dy="0">Inspection can be the endpoint.</tspan></text><text x="870" y="353" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#325549"><tspan x="870" dy="0">If not, stop with the inspection findings.</tspan></text><path d="M366,306 L442,306" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><path d="M756,306 L832,306" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><path d="M995,387 L995,496" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><text x="1017" y="455" font-family="DejaVu Sans, sans-serif" font-size="21" font-weight="400" fill="#325549"><tspan x="1017" dy="0">Yes</tspan></text><path d="M844,590 L768,590" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><path d="M454,590 L378,590" fill="none" stroke="#385363" stroke-width="3" marker-end="url(#arrow)"/><text x="64" y="751" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#182223"><tspan x="64" dy="0">A hash identifies bytes; it does not certify safe behavior. Even inspection needs restricted tooling.</tspan></text><text x="64" y="825" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#385363"><tspan x="64" dy="0">Adrian Infantes  /  AI Security Write-ups</tspan></text></svg>