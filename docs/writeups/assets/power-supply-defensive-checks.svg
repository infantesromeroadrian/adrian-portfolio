<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="823" viewBox="0 0 1600 823" role="img" aria-labelledby="title desc"><title id="title">Turning the lesson into checks</title><desc id="desc">Proposed controls and synthetic checks — no fix was implemented or validated in the reproduction.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#385363"/></marker></defs><rect width="1600" height="823" fill="#f4f1e8"/><text x="64" y="78" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#182223"><tspan x="64" dy="0">Turning the lesson into checks</tspan></text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#385363"><tspan x="64" dy="0">Proposed controls and synthetic checks — no fix was implemented or validated in the reproduction.</tspan></text><rect x="64" y="200" width="1472" height="74" rx="10" fill="#dce5e2" stroke="#9b9e93" stroke-width="2"/><text x="84" y="244" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="84" dy="0">Observed problem</tspan></text><text x="544" y="244" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="544" dy="0">Proposed control</tspan></text><text x="1034" y="244" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="1034" dy="0">Defensive check</tspan></text><rect x="64" y="274" width="460" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="84" y="310" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="84" dy="0">A visible refusal did not prevent</tspan><tspan x="84" dy="29.040000000000003">later disclosure.</tspan></text><rect x="524" y="274" width="490" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="544" y="310" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="544" dy="0">Enforce identity and role access in</tspan><tspan x="544" dy="29.040000000000003">the tool or data layer.</tspan></text><rect x="1014" y="274" width="522" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="1034" y="310" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="1034" dy="0">Synthetic unauthorized fields must never</tspan><tspan x="1034" dy="29.040000000000003">reach tool results or model context.</tspan></text><rect x="64" y="422" width="460" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="84" y="458" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="84" dy="0">Protected information was disclosed</tspan><tspan x="84" dy="29.040000000000003">across the conversation.</tspan></text><rect x="524" y="422" width="490" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="544" y="458" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="544" dy="0">Preserve sensitivity labels and</tspan><tspan x="544" dy="29.040000000000003">evaluate cumulative disclosure.</tspan></text><rect x="1014" y="422" width="522" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="1034" y="458" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="1034" dy="0">Confirm that the same data policy holds</tspan><tspan x="1034" dy="29.040000000000003">throughout an approved synthetic</tspan><tspan x="1034" dy="29.040000000000003">conversation.</tspan></text><rect x="64" y="570" width="460" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="84" y="606" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="84" dy="0">Tool access reached information</tspan><tspan x="84" dy="29.040000000000003">requiring stricter controls.</tspan></text><rect x="524" y="570" width="490" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="544" y="606" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="544" dy="0">Limit each operation to fields</tspan><tspan x="544" dy="29.040000000000003">required by its declared purpose.</tspan></text><rect x="1014" y="570" width="522" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="1034" y="606" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="1034" dy="0">Compare permitted outputs with the data</tspan><tspan x="1034" dy="29.040000000000003">contract using non-sensitive fixtures.</tspan></text><text x="64" y="788" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#385363"><tspan x="64" dy="0">Adrian Infantes  /  AI Security Write-ups</tspan></text></svg>