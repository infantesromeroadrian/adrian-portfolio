<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="971" viewBox="0 0 1600 971" role="img" aria-labelledby="title desc"><title id="title">An evidence ledger for the partial result</title><desc id="desc">Historical outcome not validated. Pending means missing evidence, not a scheduled experiment.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#385363"/></marker></defs><rect width="1600" height="971" fill="#f4f1e8"/><text x="64" y="78" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="700" fill="#182223"><tspan x="64" dy="0">An evidence ledger for the partial result</tspan></text><text x="64" y="126" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="400" fill="#385363"><tspan x="64" dy="0">Historical outcome not validated. Pending means missing evidence, not a scheduled experiment.</tspan></text><rect x="64" y="200" width="1472" height="74" rx="10" fill="#dce5e2" stroke="#9b9e93" stroke-width="2"/><text x="84" y="244" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="84" dy="0">Verified in the reported work</tspan></text><text x="544" y="244" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="544" dy="0">Pending</tspan></text><text x="1004" y="244" font-family="DejaVu Sans, sans-serif" font-size="24" font-weight="700" fill="#182223"><tspan x="1004" dy="0">Evidence needed</tspan></text><rect x="64" y="274" width="460" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="84" y="310" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="84" dy="0">Architecture and weights loaded for</tspan><tspan x="84" dy="29.040000000000003">inference.</tspan></text><rect x="524" y="274" width="460" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="544" y="310" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="544" dy="0">Equivalence to historical inference</tspan><tspan x="544" dy="29.040000000000003">conditions.</tspan></text><rect x="984" y="274" width="552" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="1004" y="310" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="1004" dy="0">Historical model identity and inference</tspan><tspan x="1004" dy="29.040000000000003">environment for comparison.</tspan></text><rect x="64" y="422" width="460" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="84" y="458" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="84" dy="0">Substitute inputs retained the</tspan><tspan x="84" dy="29.040000000000003">baseline classification.</tspan></text><rect x="524" y="422" width="460" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="544" y="458" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="544" dy="0">Identity with the original input.</tspan></text><rect x="984" y="422" width="552" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="1004" y="458" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="1004" dy="0">The original PNG and its hash. A</tspan><tspan x="1004" dy="29.040000000000003">screenshot or matching label is</tspan><tspan x="1004" dy="29.040000000000003">insufficient.</tspan></text><rect x="64" y="570" width="460" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="84" y="606" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="84" dy="0">Exactly three pixels changed in the</tspan><tspan x="84" dy="29.040000000000003">tested input.</tspan></text><rect x="524" y="570" width="460" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="544" y="606" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="544" dy="0">The class transition described in</tspan><tspan x="544" dy="29.040000000000003">the official solution.</tspan></text><rect x="984" y="570" width="552" height="148" rx="10" fill="#fffdf8" stroke="#9b9e93" stroke-width="2"/><text x="1004" y="606" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="1004" dy="0">Original input, matched model and</tspan><tspan x="1004" dy="29.040000000000003">preprocessing, and recorded outputs.</tspan></text><rect x="64" y="718" width="460" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="84" y="754" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="84" dy="0">Available and historical package</tspan><tspan x="84" dy="29.040000000000003">hashes differed.</tspan></text><rect x="524" y="718" width="460" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="544" y="754" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="544" dy="0">Which component differed and</tspan><tspan x="544" dy="29.040000000000003">whether it explains the result.</tspan></text><rect x="984" y="718" width="552" height="148" rx="10" fill="#ecefe8" stroke="#9b9e93" stroke-width="2"/><text x="1004" y="754" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="400" fill="#182223"><tspan x="1004" dy="0">Both packages and a component-level</tspan><tspan x="1004" dy="29.040000000000003">comparison.</tspan></text><text x="64" y="936" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="400" fill="#385363"><tspan x="64" dy="0">Adrian Infantes  /  AI Security Write-ups</tspan></text></svg>